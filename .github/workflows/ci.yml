name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # The test suite exercises the benchmark harness (plots, stats, HPO
        # baselines, CMA-ES), so the benchmark extra is required for collection
        # to succeed — conftest.py imports matplotlib.
        pip install -e .[dev,benchmark]
        
    - name: Lint with Ruff
      run: ruff check .

    - name: Test with pytest
      run: pytest
